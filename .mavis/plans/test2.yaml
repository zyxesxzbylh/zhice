version: 1
plan:
  name: "test"
  max_concurrency: 1
  max_consecutive_failures: 2
  max_cycles: 2
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0
tasks:
  - id: t1
    title: "t1"
    prompt: "do thing one"
    assigned_to: coder
    verified_by: verifier
    verify_prompt: "verify t1"
    max_retries: 1
  - id: t2
    title: "t2"
    prompt: "do thing two"
    assigned_to: coder
    verified_by: verifier
    verify_prompt: "verify t2"
    max_retries: 1
    depends_on: [t1]